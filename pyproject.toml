[project]
name = "youtube-publisher-agent"
version = "0.1.0"
description = "YouTube publisher agent for the Agent Platform"
requires-python = ">=3.12"
dependencies = [
    "agent-sdk",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
]

[tool.uv.sources]
agent-sdk = { git = "https://github.com/willimar/agent-sdk.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_publisher_agent"]